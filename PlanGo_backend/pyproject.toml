[project]
name = "plango-backend"
version = "0.1.0"
description = "PlanGo Backend - Django REST API"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.16.0",
    "django-cors-headers>=4.7.0",
    "django-redis>=6.0.0",
    "mysqlclient>=2.2.7",
    "firebase-admin>=6.8.0",
    "google-api-python-client>=2.169.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.0",
    "redis>=6.4.0",
    "requests>=2.32.3",
    "pycountry>=24.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []
