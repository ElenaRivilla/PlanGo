<div class="pg-participants-row">
  <ng-container *ngIf="!showInput">
    <button type="button" (click)="showInput = true" class="pg-add-btn">
      Añadir participante
    </button>
  </ng-container>
  <div class="pg-participants-col">
    <form *ngIf="showInput" (ngSubmit)="addParticipantWithDetails(participantName, destination ?? 0)" class="pg-participant-form">
      <input type="text"
        [(ngModel)]="participantName"
        name="participantName"
        placeholder="Nombre del participante"
        required
        class="pg-participant-input"
        @slideInRight>
      <div class="pg-participant-actions-wrap">
        <div class="pg-participant-actions">
          <button type="submit" class="pg-participant-save-btn">
            Guardar
          </button>
          <button type="button" (click)="cancelAdd()" class="pg-participant-cancel-btn">Cancelar</button>
        </div>
      </div>
    </form>
    <p *ngIf="participantExists()" class="pg-error-text">
      {{ ValidatorMessages['participantDuplicate'] }}
    </p>
     <p *ngIf="formSubmitted && errorMessage === ValidatorMessages['participantEmpty']" class="pg-error-text">
      {{ ValidatorMessages['participantEmpty'] }}
    </p>
  </div>
</div>
<p-toast></p-toast>
